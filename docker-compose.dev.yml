services:
  db:
    image: postgis/postgis:15-3.4
    container_name: zim-rental-db-dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-zimrental}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-zimrental123}
      POSTGRES_DB: ${DB_NAME:-zimrental}
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
      - ./db/init-postgis.sql:/docker-entrypoint-initdb.d/init-postgis.sql
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-zimrental} -d ${DB_NAME:-zimrental}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - zim-rental-dev-net

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: zim-rental-api-dev
    restart: unless-stopped
    volumes:
      - ./backend:/app
      - uploads_dev:/app/app/static/uploads
      - receipts_dev:/app/app/static/receipts
      - reports_dev:/app/app/static/reports
    ports:
      - "${API_PORT:-8000}:8000"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - SECRET_KEY=${SECRET_KEY}
      - ALGORITHM=${ALGORITHM:-HS256}
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES:-480}
      - SMS_API_KEY=${SMS_API_KEY}
      - SMS_SENDER_ID=${SMS_SENDER_ID}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - zim-rental-dev-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: zim-rental-frontend-dev
    restart: unless-stopped
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    environment:
      - VITE_API_URL=http://api:8000
    depends_on:
      - api
    networks:
      - zim-rental-dev-net

volumes:
  postgres_data_dev:
  uploads_dev:
  receipts_dev:
  reports_dev:

networks:
  zim-rental-dev-net:
    driver: bridge